name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLY_APP: sakila-api

jobs:
  deploy:
    name: Test, build, publish and deploy
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test pipeline
        run: ./mvnw clean verify -Pintegration-tests

      - name: Publish JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakila-api-jar
          path: target/sakila-api.jar

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set app secrets
        run: |
          flyctl secrets set \
            SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
            SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
            SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            JWT_EXPIRATION_MINUTES="${{ secrets.JWT_EXPIRATION_MINUTES }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          URL="https://$FLY_APP.fly.dev/actuator/health"
          for i in $(seq 1 24); do
            if curl -fsS "$URL" | grep -q '"status":"UP"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for app to become healthy..."
            sleep 10
          done
          echo "Health check failed: app did not respond with UP"
          curl -sS "$URL" || true
          exit 1
        env:
          FLY_APP: ${{ env.FLY_APP }}
